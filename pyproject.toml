[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-opencv-python"
version = "0.1.0"
description = "Mojo kernels for an OpenCV-compatible image-processing subset"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mojo_opencv = ["py.typed"]
